<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEFORE & AFTER | WHINISH PREMIUM</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        .cases-hero {
            background: linear-gradient(rgba(0,31,63,0.8), rgba(0,31,63,0.8)), url('../assets/img/hero-bg.png');
            background-size: cover; background-position: center;
            height: 400px; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff;
        }
        
        .slider-container {
            max-width: 1000px; margin: 80px auto; position: relative; border-radius: 20px; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
        }
        .comparison-slider {
            position: relative; width: 100%; height: 600px; overflow: hidden; cursor: ew-resize;
        }
        .comparison-slider img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .img-before { z-index: 1; }
        .img-after { z-index: 2; width: 50%; } /* This will be clipped */
        
        .slider-handle {
            position: absolute; z-index: 3; top: 0; left: 50%; width: 4px; height: 100%; background: #fff;
            transform: translateX(-50%); pointer-events: none;
        }
        .slider-button {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: var(--accent-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--primary-color);
            font-weight: 900; box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        
        .case-info {
            max-width: 1000px; margin: 40px auto 100px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px;
        }
        .info-box { background: var(--bg-light); padding: 30px; border-radius: 15px; text-align: center; }
        .info-box h4 { color: var(--primary-color); margin-bottom: 10px; }
        .info-box p { color: var(--text-muted); font-size: 0.9rem; }

        .label {
            position: absolute; bottom: 20px; padding: 10px 20px; background: rgba(0,0,0,0.5); color: #fff;
            font-weight: 700; font-size: 0.9rem; border-radius: 5px; z-index: 4;
        }
        .label-before { left: 20px; }
        .label-after { right: 20px; }

        @media (max-width: 768px) {
            .comparison-slider { height: 400px; }
            .case-info { grid-template-columns: 1fr; padding: 0 20px; }
        }
    </style>
</head>
<body>
    <header id="main-header"></header>
    
    <main>
        <section class="cases-hero">
            <div class="container">
                <p class="uppercase" style="letter-spacing: 3px; font-weight: 600; color: var(--accent-color);">Real Transformations</p>
                <h1 class="uppercase" style="font-size: 3.5rem;">Before & After</h1>
                <p>휘니쉬가 선사하는 기적 같은 변화, 수치와 결과로 증명합니다.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div style="text-align: center; margin-bottom: 50px;">
                    <h2 class="uppercase" style="color: var(--accent-color); font-size: 1rem; letter-spacing: 3px;">Treatment Case #01</h2>
                    <h3 style="font-size: 2.5rem; color: var(--primary-color);">WHINISH 초정밀 심미보철</h3>
                </div>

                <div class="slider-container">
                    <div class="comparison-slider" id="slider">
                        <!-- Before Image -->
                        <img src="../assets/img/case-before.png" class="img-before" alt="Before">
                        <!-- After Image -->
                        <div class="img-after" id="after-img-container" style="position: absolute; top: 0; left: 0; height: 100%; overflow: hidden; width: 50%; z-index: 2;">
                            <img src="../assets/img/case-after.png" style="width: 1000px; height: 600px; max-width: none;" alt="After">
                        </div>
                        
                        <div class="slider-handle" id="handle">
                            <div class="slider-button">↔</div>
                        </div>
                        
                        <span class="label label-before">BEFORE</span>
                        <span class="label label-after">AFTER (WHINISH)</span>
                    </div>
                </div>

                <div class="case-info">
                    <div class="info-box">
                        <h4>진단 내용</h4>
                        <p>치아 변색 및 불규칙한 치열, 앞니 공간 벌어짐</p>
                    </div>
                    <div class="info-box">
                        <h4>치료 방법</h4>
                        <p>WHINISH 초정밀 라미네이트 (6 units)</p>
                    </div>
                    <div class="info-box">
                        <h4>소요 기간</h4>
                        <p>단 1일 (원데이 시스템 적용)</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>
    <script src="../assets/js/main.js"></script>
    <script>
        const slider = document.getElementById('slider');
        const afterImg = document.getElementById('after-img-container');
        const handle = document.getElementById('handle');

        let isResizing = false;

        const setPosition = (x) => {
            let rect = slider.getBoundingClientRect();
            let pos = ((x - rect.left) / rect.width) * 100;
            if (pos < 0) pos = 0;
            if (pos > 100) pos = 100;
            
            afterImg.style.width = pos + '%';
            handle.style.left = pos + '%';
        };

        slider.addEventListener('mousedown', () => isResizing = true);
        window.addEventListener('mouseup', () => isResizing = false);
        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            setPosition(e.pageX);
        });

        // Touch support
        slider.addEventListener('touchstart', () => isResizing = true);
        window.addEventListener('touchend', () => isResizing = false);
        window.addEventListener('touchmove', (e) => {
            if (!isResizing) return;
            setPosition(e.touches[0].pageX);
        });
    </script>
</body>
</html>
