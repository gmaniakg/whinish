<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초정밀 솔루션 | Whinish</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>

    <header id="main-header"></header>

    <main>
        <section class="section">
            <div class="container">
                <div style="text-align: center; margin-bottom: 80px;">
                    <h1 style="font-size: 3.5rem; color: var(--primary-color); margin-bottom: 20px;">초정밀 솔루션 Whinish</h1>
                    <p style="font-size: 1.2rem; color: var(--text-muted);">미니쉬는 치아 정돈부터 제작, 결합에 이르기까지 전 과정에서의 정밀함을 추구합니다.</p>
                </div>

                <div class="content-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;">
                    <div class="text-box">
                        <h2 style="font-size: 2.5rem; margin-bottom: 20px;">보철의 완성도가 <br>수명을 결정한다!</h2>
                        <p style="font-size: 1.1rem; line-height: 1.8; color: var(--text-muted);">
                            오차 없이 정밀한 치아 스캔을 통해 자연치아의 손상 부위에 맞게 정교하게 제작되며 정확하게 결합합니다. <br><br>
                            구강 스캔 후 모든 치아를 디지털 정보로 전환하여 원내 기공연구소로 전송하여 본뜨는 과정에서 발생하는 재료변형에 의한 오차를 줄였습니다.
                        </p>
                    </div>
                    <div class="image-box" style="background: #eee; height: 400px; border-radius: 20px;">
                        <!-- Image Placeholder -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
