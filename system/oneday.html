<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원데이 시스템 | Whinish</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>

    <header id="main-header"></header>

    <main>
        <section class="section">
            <div class="container">
                <div style="text-align: center; margin-bottom: 80px;">
                    <p style="color: var(--accent-color); font-weight: 600;">WHINISH One Day System</p>
                    <h1 style="font-size: 3.5rem; color: var(--primary-color); margin-bottom: 20px;">Whinish 원데이 시스템</h1>
                    <p style="font-size: 1.2rem; color: var(--text-muted); max-width: 700px; margin: 0 auto;">
                        빠른 게 능사가 아닙니다. 정확하고 정밀하게 제작하면서 빨라야 합니다. <br>
                        이것이 Whinish 원데이 시스템이 독보적인 이유입니다.
                    </p>
                </div>

                <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 60px;">
                    <div style="flex: 1; padding: 40px; background: #f8f9fa; border-radius: 20px; text-align: center;">
                        <h3 style="margin-bottom: 20px;">높은 정확도의 최첨단 장비</h3>
                        <p>디지털 스캐너와 밀링 머신을 통한 당일 제작</p>
                    </div>
                    <div style="flex: 1; padding: 40px; background: #f8f9fa; border-radius: 20px; text-align: center;">
                        <h3 style="margin-bottom: 20px;">치아 제작 모형 비교</h3>
                        <p>정밀도의 차이가 결과의 차이를 만듭니다.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
