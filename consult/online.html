<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLINE CONSULT | WHINISH PREMIUM</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        .consult-hero {
            background: linear-gradient(rgba(0,31,63,0.8), rgba(0,31,63,0.8)), url('../assets/img/reception.png');
            background-size: cover; background-position: center;
            height: 400px; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff;
        }
        .consult-form-container {
            max-width: 800px;
            margin: -100px auto 100px;
            background: #fff;
            padding: 60px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            position: relative; z-index: 10;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: none;
            /* Override body text-transform for inputs */
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        .privacy-box {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-height: 150px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .consult-form-container { padding: 40px 20px; margin-top: -50px; }
            .consult-hero h1 { font-size: 2.5rem; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header id="main-header"></header>

    <main>
        <section class="consult-hero">
            <div class="container animate-up">
                <p class="uppercase" style="letter-spacing: 3px; font-weight: 600; color: var(--accent-color);">Premium Service</p>
                <h1 class="uppercase" style="font-size: 3.5rem;">Online Consultation</h1>
                <p>당신의 고민을 남겨주시면, 전문 상담원이 정성을 다해 답변해 드립니다.</p>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="consult-form-container animate-up">
                    <form id="contactForm">
                        <input type="hidden" name="subject" value="Whinish 온라인 상담 신청">
                        <input type="hidden" name="from_name" value="Whinish Website">

                        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label for="name">성함 (NAME)</label>
                                <input type="text" id="name" name="name" placeholder="성함을 입력해주세요" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">연락처 (PHONE)</label>
                                <input type="tel" id="phone" name="phone" placeholder="'-' 제외하고 입력" required>
                            </div>
                        </div>

                        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label for="interest">관심 진료 (INTEREST)</label>
                                <select id="interest" name="interest" required>
                                    <option value="" disabled selected>진료 항목을 선택해주세요</option>
                                    <option value="WHINISH">휘니쉬 (심미보철)</option>
                                    <option value="ORTHO">치아교정</option>
                                    <option value="IMPLANT">임플란트</option>
                                    <option value="WHITE">치아미백</option>
                                    <option value="GENERAL">일반진료/기타</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="preferred_time">상담 희망 시간 (TIME)</label>
                                <select id="preferred_time" name="preferred_time">
                                    <option value="any">상관없음</option>
                                    <option value="morning">오전 (10:00 - 13:00)</option>
                                    <option value="afternoon">오후 (14:00 - 18:00)</option>
                                    <option value="evening">야간 (18:00 이후, 화/목)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="message">상담 내용 (MESSAGE)</label>
                            <textarea id="message" name="message" rows="5" placeholder="궁금하신 내용을 자유롭게 남겨주세요"
                                required></textarea>
                        </div>

                        <div class="form-group">
                            <label>개인정보 취급방침 동의</label>
                            <div class="privacy-box">
                                화이트스타일치과(이하 '본원')는 고객님의 개인정보를 중요시하며, '정보통신망 이용촉진 및 정보보호'에 관한 법률을 준수하고 있습니다. <br><br>
                                1. 수집항목: 성함, 연락처, 상담내용 <br>
                                2. 수집목적: 온라인 상담 답변 및 예약 안내 <br>
                                3. 보유기간: 목적 달성 후 즉시 파기 (최대 1년 보관)
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem;">
                                <input type="checkbox" id="privacy" name="privacy" style="width: auto;" required>
                                <label for="privacy" style="margin-bottom: 0; font-weight: 500;">개인정보 취급방침에
                                    동의합니다.</label>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn">상담 신청하기 (SUBMIT)</button>
                        <div id="formStatus" style="margin-top: 20px; text-align: center; display: none; font-weight: 700; padding: 15px; border-radius: 8px;"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>
    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            
            btn.disabled = true;
            btn.innerText = '전송 중...';
            
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(object)
                });

                const result = await response.json();
                
                status.style.display = 'block';
                if (response.status === 200) {
                    status.style.backgroundColor = '#e8f5e9';
                    status.style.color = '#2e7d32';
                    status.innerText = '✅ 상담 신청이 완료되었습니다. 곧 연락드리겠습니다!';
                    form.reset();
                } else {
                    const errorMsg = result.message || '알 수 없는 오류';
                    status.style.backgroundColor = '#ffebee';
                    status.style.color = '#c62828';
                    status.innerText = '❌ 전송 실패: ' + errorMsg;
                }
            } catch (error) {
                status.style.display = 'block';
                status.style.backgroundColor = '#ffebee';
                status.style.color = '#c62828';
                status.innerText = '❌ 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
            } finally {
                btn.disabled = false;
                btn.innerText = '상담 신청하기 (SUBMIT)';
            }
        });
    </script>
</body>
</html>
