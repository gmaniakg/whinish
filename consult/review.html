<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생생후기 | Whinish</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        .review-stats {
            background: var(--bg-light);
            padding: 40px;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 60px;
        }
        .stat-item h3 { font-size: 2.5rem; color: var(--primary-color); }
        .stat-item p { color: var(--text-muted); }

        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .review-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }
        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .rating { color: #ffcc00; margin-bottom: 15px; }
        .review-text {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.7;
            margin-bottom: 20px;
            height: 120px;
            overflow: hidden;
            position: relative;
        }
        .review-text::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40px;
            background: linear-gradient(transparent, #fff);
        }
        .reviewer {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .reviewer-avatar {
            width: 40px; height: 40px;
            background: #eee;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #999;
        }
        .reviewer-info b { font-size: 0.9rem; display: block; }
        .reviewer-info span { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header id="main-header"></header>

    <main>
        <section class="section">
            <div class="container">
                <div style="text-align: center; margin-bottom: 80px;">
                    <p style="color: var(--accent-color); font-weight: 600;">Real Patient Reviews</p>
                    <h1 style="font-size: 3.5rem; color: var(--primary-color);">Whinish 생생후기</h1>
                    <p style="font-size: 1.2rem; color: var(--text-muted); margin-top: 20px;">
                        광고가 아닌 실제 환자분들이 남겨주신 정성스러운 후기입니다. <br>
                        30년 전통의 진심을 Whinish가 이어갑니다.
                    </p>
                </div>

                <div class="review-stats">
                    <div class="stat-item">
                        <h3>4.9/5</h3>
                        <p>평균 만족도</p>
                    </div>
                    <div class="stat-item">
                        <h3>12,450+</h3>
                        <p>누적 치료 후기</p>
                    </div>
                    <div class="stat-item">
                        <h3>98%</h3>
                        <p>지인 추천율</p>
                    </div>
                </div>

                <div class="review-grid" id="dynamic-reviews">
                    <!-- Loading State -->
                    <div style="text-align: center; grid-column: 1 / -1; padding: 50px;">
                        <p style="color: var(--text-muted);">최신 리뷰를 불러오고 있습니다...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
    <script>
        async function fetchReviews() {
            try {
                const response = await fetch('/api/reviews');
                const reviews = await response.json();
                const container = document.getElementById('dynamic-reviews');
                
                if (reviews.length > 0) {
                    container.innerHTML = '';
                    reviews.forEach(review => {
                        const stars = '★'.repeat(review.rating || 5);
                        const card = document.createElement('div');
                        card.className = 'review-card animate-up';
                        card.innerHTML = `
                            <div class="rating">${stars}</div>
                            <div class="review-text">${review.body}</div>
                            <div class="reviewer">
                                <div class="reviewer-avatar">${review.nickname.charAt(0)}</div>
                                <div class="reviewer-info">
                                    <b>${review.nickname} 님</b>
                                    <span>${review.date} | 네이버 방문자 리뷰</span>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">리뷰를 불러올 수 없습니다.</p>';
                }
            } catch (error) {
                console.error('Error loading reviews:', error);
                document.getElementById('dynamic-reviews').innerHTML = '<p style="text-align:center; grid-column:1/-1;">서버 연결 오류가 발생했습니다.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', fetchReviews);
    </script>
</body>
</html>
