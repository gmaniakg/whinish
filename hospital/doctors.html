<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의료진 소개 | Whinish</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        .doctor-card { display: flex; gap: 60px; margin-bottom: 100px; align-items: center; }
        .doctor-card:nth-child(even) { flex-direction: row-reverse; }
        .doctor-img { flex: 1; background: #f0f0f0; height: 500px; border-radius: 30px; overflow: hidden; }
        .doctor-info { flex: 1.2; }
        .doctor-info h2 { font-size: 3rem; color: var(--primary-color); margin-bottom: 20px; }
    </style>
</head>
<body>
    <header id="main-header"></header>
    <main>
        <section class="section">
            <div class="container">
                <h1 style="text-align: center; margin-bottom: 80px;">Whinish 의료진</h1>
                <div class="doctor-card">
                    <div class="doctor-img"><img src="../assets/img/dr-lee.png" style="width:100%; height:100%; object-fit:cover;"></div>
                    <div class="doctor-info">
                        <h2>이봉진 대표원장</h2>
                        <p>연세대학교 치과대학 졸업 | 임플란트·심미보철 전문가</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer id="main-footer"></footer>
    <script src="../assets/js/main.js"></script>
</body>
</html>
