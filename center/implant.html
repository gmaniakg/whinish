<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임플란트 | 화이트스타일치과 WHINISH PREMIUM - 3D 디지털 가이드 임플란트</title>
    <meta name="description" content="30년 경력 노하우의 화이트스타일치과 디지털 임플란트. 3D 가이드 무절개 식립으로 통증과 부기를 최소화하고 정확도를 높인 프리미엄 임플란트 솔루션.">
    <meta name="keywords" content="강남역임플란트, 디지털임플란트, 무절개임플란트, 강남임플란트잘하는곳, 화이트스타일치과임플란트">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>

    <header id="main-header"></header>

    <main>
        <section class="section">
            <div class="container">
                <div style="text-align: center; margin-bottom: 80px;">
                    <p style="color: var(--accent-color); font-weight: 600;">Advanced Implant System</p>
                    <h1 style="font-size: 3.5rem; color: var(--primary-color);">Whinish 디지털 임플란트</h1>
                    <p style="font-size: 1.2rem; color: var(--text-muted); margin-top: 20px;">
                        오차 없는 정밀함, 통증을 줄인 편안함. <br>
                        3D 디지털 가이드 시스템으로 완성하는 맞춤형 임플란트입니다.
                    </p>
                </div>

                <div class="content-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;">
                    <div class="image-box">
                        <img src="../assets/img/treatment.png" alt="Digital Implant" style="border-radius: 20px;">
                    </div>
                    <div class="text-box">
                        <h2 style="font-size: 2.2rem; margin-bottom: 20px; color: var(--primary-color);">왜 Whinish 임플란트인가요?</h2>
                        <ul style="list-style: none; padding: 0;">
                            <li style="margin-bottom: 20px; padding-left: 30px; position: relative;">
                                <b style="display: block; font-size: 1.2rem;">01. 3D 디지털 정밀 진단</b>
                                <span style="color: var(--text-muted);">CT 데이터를 바탕으로 식립 위치와 각도를 미리 계산하여 정확도를 높입니다.</span>
                            </li>
                            <li style="margin-bottom: 20px; padding-left: 30px; position: relative;">
                                <b style="display: block; font-size: 1.2rem;">02. 무절개 가이드 식립</b>
                                <span style="color: var(--text-muted);">잇몸 절개를 최소화하여 통증과 부기를 획기적으로 줄였습니다.</span>
                            </li>
                            <li style="margin-bottom: 20px; padding-left: 30px; position: relative;">
                                <b style="display: block; font-size: 1.2rem;">03. 정품 보증 시스템</b>
                                <span style="color: var(--text-muted);">세계적으로 검증된 정품 재료만을 사용하며, 정품 보증서를 발급합니다.</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
